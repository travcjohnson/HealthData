name: Deploy Ridgeline to GitHub Pages

on:
  push:
    branches: [main, claude/adoring-hypatia-90qrt6]
    paths:
      - "webapp/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Publish webapp/ as the root of the gh-pages branch. Pages serves that
      # branch automatically; this needs only the default contents:write token.
      - name: Publish webapp/ to gh-pages
        run: |
          cd webapp
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
